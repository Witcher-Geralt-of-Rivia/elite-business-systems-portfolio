<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Elite Business Systems</title>
<style>
  :root { --bg:#0b0f17; --fg:#e6e9ef; --muted:#8b93a7; --accent:#6aa3ff; }
  @media (prefers-color-scheme: light) { :root { --bg:#f7f8fb; --fg:#151a24; --muted:#5b6478; --accent:#2557d6; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:560px; }
  h1 { font-size:1.75rem; margin:0 0 .5rem; letter-spacing:-.01em; }
  p { color:var(--muted); margin:.25rem 0; }
  .tag { display:inline-block; font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); margin-bottom:1rem; }
</style>
</head>
<body>
<main>
  <span class="tag">In development</span>
  <h1>Elite Business Systems</h1>
  <p>CRM, ERP and POS showcase environments built on open-source foundations, populated with fictional business activity.</p>
  <p>The applications are being deployed. Progress is tracked publicly on GitHub.</p>
</main>
</body>
</html>
